name: Deploy demo sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # build.ps1 is written for Windows PowerShell 5.1, so it builds on Windows,
    # the same way it runs on my laptop.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every client in clients/
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site
      - name: Add the demo index page
        run: |
          find site -name _headers -delete   # Cloudflare-only file, not used by GitHub Pages
          cp .github/pages/index.html site/
          cp docs/clinic.png docs/salon.png docs/stay.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
